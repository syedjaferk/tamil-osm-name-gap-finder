# Use this instead of docker-compose.prod.yml when the server already runs Nginx on 80/443
# (e.g. alongside the course portal). Run the app with PORT=8010 in .env and
# OSM_REDIRECT_URI=https://osm.example.com/auth/callback, then get a cert with:
#   sudo certbot --nginx -d osm.example.com

server {
    listen 80;
    server_name osm.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name osm.example.com;

    ssl_certificate     /etc/letsencrypt/live/osm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/osm.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;   # Overpass scans can be slow
    }
}
