# Production: Caddy terminates HTTPS on 80/443 and proxies to the app.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  app:
    environment:
      OSM_REDIRECT_URI: https://${DOMAIN:?set DOMAIN in .env}/auth/callback
      DRY_RUN: ${DRY_RUN:-0}
    # Only Caddy talks to the app; nothing is published on the host.
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
