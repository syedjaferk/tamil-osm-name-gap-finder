services:
  app:
    build: .
    image: tamil-osm-name-gap-finder:latest
    container_name: tamil-osm-name-gap-finder
    restart: unless-stopped
    env_file: .env
    environment:
      OSM_REDIRECT_URI: ${OSM_REDIRECT_URI:-http://127.0.0.1:8000/auth/callback}
      DRY_RUN: ${DRY_RUN:-1}
    ports:
      # Bound to localhost only; put a reverse proxy (nginx/Caddy) with HTTPS in front for production.
      - "127.0.0.1:${PORT:-8000}:8000"
